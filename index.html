<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meowie Tools</title>
    <!-- اسکریپت رسمی تلگرام برای مینی اپ -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-bg: #0f172a; /* سورمه ای تیره */
            --navy-card: #1e293b; /* سورمه ای کارت */
            --white: #ffffff;
            --gray-text: #94a3b8;
            --accent: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--navy-bg);
            color: var(--white);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* هدر بالای صفحه */
        .header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--white);
        }

        /* بخش پروفایل و آواتار */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(145deg, var(--navy-card), var(--navy-bg));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: var(--white);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .username {
            font-size: 14px;
            color: var(--gray-text);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 5px;
        }

        /* بخش دو پنجره (دکمه ها) */
        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-grow: 1;
        }

        .menu-btn {
            background: var(--white);
            color: var(--navy-bg);
            border: none;
            border-radius: 18px;
            padding: 20px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .menu-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .menu-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--navy-bg);
        }

        /* افکت هاور برای دکمه ها */
        .menu-btn:hover {
            box-shadow: 0 8px 25px rgba(255,255,255,0.1);
        }

        /* نوار پایین (شبیه عکس) */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--navy-card);
            border-radius: 20px;
            padding: 10px;
            margin-top: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-item {
            color: var(--gray-text);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
            padding: 5px 15px;
            border-radius: 12px;
        }

        .nav-item.active {
            color: var(--navy-bg);
            background: var(--white);
        }

    </style>
</head>
<body>

    <!-- هدر -->
    <div class="header">
        <h1>Meowie Tools 🐱</h1>
    </div>

    <!-- بخش پروفایل -->
    <div class="profile-section">
        <div class="avatar">🐱</div>
        <div style="font-weight: bold; font-size: 18px; margin-top: 5px;">کاربر تلگرام</div>
        <div class="username" id="user-id">@username</div>
    </div>

    <!-- منوی اصلی (دو پنجره درخواستی) -->
    <div class="main-menu">
        <button class="menu-btn" onclick="openApp('sms')">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
            SMS Bomber
        </button>
        
        <button class="menu-btn" onclick="openApp('call')">
            <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            Call Bomber
        </button>
    </div>

    <!-- نوار پایین -->
    <div class="bottom-nav">
        <div class="nav-item active">🏠</div>
        <div class="nav-item">⚙️</div>
    </div>

    <script>
        // متصل شدن به تلگرام
        const tg = window.Telegram.WebApp;
        tg.expand(); // پر کردن کل صفحه

        // گرفتن اطلاعات کاربر از تلگرام
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-id').innerText = user.first_name + " " + (user.last_name || "");
        }

        // تابع کلیک روی دکمه ها
        function openApp(type) {
            tg.HapticFeedback.impactOccurred('medium'); // لرزش گوشی
            
            if (type === 'sms') {
                // اینجا می تونی هدایت کنی به صفحه یا API مربوط به SMS
                tg.showAlert("ورود به بخش SMS Bomber (اینجا باید به API سرورت وصل بشه)");
            } else if (type === 'call') {
                // اینجا می تونی هدایت کنی به صفحه یا API مربوط به Call
                tg.showAlert("ورود به بخش Call Bomber (اینجا باید به API سرورت وصل بشه)");
            }
        }
    </script>
</body>
</html>
